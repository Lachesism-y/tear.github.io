<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一滴泪</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Songti TC", "STSong", serif; }
        #starfield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .page-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s; opacity: 0; pointer-events: none; z-index: 10; }
        .active-page { opacity: 1; pointer-events: auto; }
        .main-text { color: #fff; font-size: 20px; letter-spacing: 4px; line-height: 2.2; animation: breath 5s infinite alternate; }
        .sub-text { display: block; margin-top: 15px; font-size: 18px; color: #ccc; }
        .divider { width: 30px; height: 1px; background: rgba(255,255,255,0.15); margin: 40px auto 0; }
        .music-tip { position: absolute; bottom: 40px; color: rgba(255,255,255,0.4); font-size: 12px; animation: blink 2s infinite; pointer-events: none; }
        .heartbeat-glow { position: absolute; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%); border-radius: 50%; opacity: 0; transition: opacity 2s; }
        .page2-active .heartbeat-glow { animation: heartbeatPulse 2.5s infinite; }
        .title-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; z-index: 2; }
        .title { color: #fff; font-size: 36px; letter-spacing: 16px; text-shadow: 0 0 10px rgba(255,255,255,0.8); opacity: 0; filter: blur(10px); transition: all 2.5s; }
        .title.show { opacity: 1; filter: blur(0); }
        .page2-active .title { animation: breathSpacing 4s infinite alternate; }
        .hanging-tear { width: 4px; height: 4px; background: #fff; border-radius: 50%; margin-top: 15px; opacity: 0; box-shadow: 0 0 10px 2px rgba(255,255,255,0.6); }
        .hanging-tear.show { opacity: 0.8; animation: tearShiver 3s infinite; }
        .info-group { display: flex; flex-direction: column; gap: 20px; min-height: 220px; z-index: 2; }
        .info-item { color: #e8e8e8; font-size: 17px; letter-spacing: 4px; opacity: 0; transform: translateY(15px); transition: all 0.8s; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .name { font-size: 20px; color: #fff; }
        .show-item { opacity: 1 !important; transform: translateY(0) !important; }
        .tap-hint { position: absolute; bottom: 40px; color: rgba(255,255,255,0.4); font-size: 12px; opacity: 0; animation: blink 2s infinite; pointer-events: none; }
.p3-quote { color: #fff; font-size: 22px; letter-spacing: 8px; margin-bottom: 20px; opacity: 0; transform: translateY(10px); transition: all 1.5s; }
.tear-container { height: 60px; position: relative; margin-bottom: 20px; }
.cursor-line { width: 1px; height: 20px; background: #fff; opacity: 0; animation: blinkCursor 1s infinite; }
.real-tear { width: 7px; height: 7px; background: #fff; border-radius: 0 50% 50% 50%; transform: rotate(45deg); position: absolute; top: 15px; opacity: 0; }
.animate-cursor { opacity: 1; }
.animate-tear-drop { animation: tearFall 2s forwards; }
.p3-grid { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 10px; }
.p3-tag-group { display: flex; gap: 20px; opacity: 0; transition: all 1.5s; }
.p3-tag { color: #fff; font-size: 13px; letter-spacing: 3px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 3px; }
.p3-random { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 2px; opacity: 0; transition: all 1.2s; }
#page4 { justify-content: flex-start; padding-top: 12vh; overflow-y: auto; }
.p4-wrapper { width: 85%; max-width: 400px; display: flex; flex-direction: column; gap: 50px; }
.p4-item { display: flex; flex-direction: column; opacity: 0; transform: translateY(15px); filter: blur(8px); transition: all 2s; }
.p4-item.focus-in { opacity: 1; transform: translateY(0); filter: blur(0); }
.p4-text { color: #e8e8e8; font-size: 17px; letter-spacing: 2px; line-height: 1.8; }
.p4-q1 { text-align: left; padding-left: 10%; }
.p4-q2 { text-align: right; padding-right: 10%; font-size: 16px; }
.p4-q3 { text-align: left; padding-left: 5%; font-weight: 300; }
.p4-q4 { text-align: center; font-size: 18px; padding: 0 10%; }
.ripple-container { position: absolute; top: -20px; left: 15%; width: 50px; height: 50px; opacity: 0; transition: opacity 1s; }
.ripple { position: absolute; border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; width: 0; height: 0; opacity: 0; }
.animate-ripple .ripple1 { animation: rippleAnim 3s ease-out forwards; }
.animate-ripple .ripple2 { animation: rippleAnim 3s ease-out 0.5s forwards; }
.p4-tag-wrapper { display: flex; flex-direction: column; margin-top: 15px; opacity: 0; transition: all 1.5s; }
.p4-tag-wrapper.show { opacity: 1; }
.p4-tag { text-decoration: none; display: inline-block; font-size: 11px; color: rgba(255,255,255,0.6); padding: 4px 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); transition: all 0.3s ease; cursor: pointer; }
.p4-tag:hover { color: #fff; border-color: rgba(255,255,255,0.8); box-shadow: 0 0 10px rgba(255,255,255,0.3); text-shadow: 0 0 5px #fff; }
.tag-right { align-self: flex-end; margin-right: 10%; align-items: flex-end; }
.tag-left { align-self: flex-start; margin-left: 5%; align-items: flex-start; }
.tag-center { align-self: center; margin-top: 20px; align-items: center; }
.mini-tear { width: 5px; height: 5px; background: #fff; border-radius: 0 50% 50% 50%; transform: rotate(45deg); opacity: 0; }
.p4-tag-wrapper.show .mini-tear { animation: miniTearFall 2s forwards 0.5s; }
        #page5 { justify-content: flex-start; padding-top: 10vh; overflow-y: auto; }
        .paper-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 30px 30px; opacity: 0; transition: opacity 3s; }
        .paper-grid.show { opacity: 1; }
        .p5-wrapper { width: 85%; max-width: 380px; z-index: 2; }
        .p5-quote { color: #fff; font-size: 18px; text-align: center; margin-bottom: 30px; opacity: 0; transition: all 1.5s; }
        .p5-quote.show { opacity: 1; }
        .p5-header { font-size: 16px; color: #e0e0e0; margin-bottom: 20px; opacity: 0; transition: opacity 1s; display: flex; align-items: center; }
        .p5-header.show { opacity: 1; }
        .ink-tear { width: 6px; height: 10px; background: #fff; border-radius: 0 50% 50% 50%; transform: rotate(45deg); margin-left: 10px; opacity: 0; }
        .p5-header.show .ink-tear { animation: inkFall 4s forwards; }
        .p5-rules-box { border: 1px solid rgba(255,255,255,0.1); background: rgba(10,10,10,0.6); padding: 20px 15px; display: flex; flex-direction: column; gap: 12px; }
        .type-line { font-family: monospace; color: #b0b0b0; font-size: 13px; opacity: 0; }
        .type-line.show { opacity: 1; transition: opacity 0.3s; }
        .highlight { color: #fff; font-weight: bold; }
        .type-cursor { display: inline-block; width: 6px; height: 14px; background: #fff; animation: blink 1s infinite; }
        .p6-text-1 { color: #fff; font-size: 22px; letter-spacing: 5px; opacity: 0; filter: blur(5px); transition: all 2.5s; z-index: 2; text-shadow: 0 0 15px rgba(255,255,255,0.8); }
        .p6-text-1.show { opacity: 1; filter: blur(0); }
        .p6-text-2 { color: #fff; font-size: 24px; letter-spacing: 10px; opacity: 0; transition: all 3s; z-index: 2; text-shadow: 0 0 20px rgba(255,255,255,0.9); margin-top: 40px; }
        .p6-text-2.show { opacity: 1; }
        @keyframes breath { 0% { opacity: 0.75; } 100% { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes tearFall { 0% { opacity: 1; transform: translateY(0) rotate(45deg); } 100% { opacity: 0; transform: translateY(60px) rotate(45deg); } }
        @keyframes rippleAnim { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 150px; height: 30px; opacity: 0; } }
        @keyframes miniTearFall { 0% { opacity: 1; transform: translateY(0) rotate(45deg); } 100% { opacity: 0; transform: translateY(35px) rotate(45deg); } }
        @keyframes inkFall { 0% { opacity: 1; transform: translateY(-10px) rotate(45deg); } 100% { opacity: 0; transform: translateY(60px) rotate(45deg) scale(3); filter: blur(4px); } }
        @keyframes heartbeatPulse { 0% { transform: scale(0.8); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(0.8); opacity: 0.3; } }
        @keyframes breathSpacing { 0% { letter-spacing: 14px; } 100% { letter-spacing: 18px; } }
        @keyframes tearShiver { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
        .fade-in-up { opacity: 1 !important; transform: translateY(0) !important; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
<div id="page1" class="page-container active-page">
    <div class="main-text">一滴淚<span class="sub-text">承諾不過逝水輕淺</span></div>
    <div class="divider"></div>
    <div class="music-tip" id="musicTip">點擊屏幕以播放音樂</div>
</div>
<div id="page2" class="page-container">
    <div class="heartbeat-glow"></div>
    <div class="title-container"><div class="title" id="p2-title">萍水相逢</div><div class="hanging-tear" id="hangingTear"></div></div>
    <div class="info-group" id="p2-info"></div><div class="tap-hint" id="tapHint2">輕觸屏幕，繼續</div>
</div>
<div id="page3" class="page-container">
    <div class="p3-quote" id="p3-quote">人生須臾 不過爾爾</div>
    <div class="tear-container"><div class="cursor-line" id="p3-cursor"></div><div class="real-tear" id="p3-tear"></div></div>
    <div class="p3-grid">
        <div class="p3-tag-group" id="p3-tags"><div class="p3-tag">高戀 · 惡趣味 · 挑逗</div><div class="p3-tag">中低戀 · 邏輯 · 剖析</div></div>
        <div class="p3-random" id="p3-random-dog"></div><div class="p3-random" id="p3-random-prop"></div>
    </div>
    <div class="tap-hint" id="tapHint3" style="display: none;">輕觸屏幕，揭開</div>
</div>
<div id="page4" class="page-container">
    <div class="p4-wrapper">
        <div class="p4-item" id="box1"><div class="p4-text p4-q1">我的一滴淚，<br>有落入你心裡嗎？</div><div class="ripple-container" id="rippleBox"><div class="ripple ripple1"></div><div class="ripple ripple2"></div></div></div>
        <div class="p4-item" id="box2">
            <div class="p4-text p4-q2">緣深緣淺<br>不過兩顆心的距離</div>
            <div class="p4-tag-wrapper tag-right" id="tag1">
                <a href=" " target="_blank" class="p4-tag">「 板評 」</a >
                <div class="mini-tear"></div>
            </div>
        </div>
        <div class="p4-item" id="box3">
            <div class="p4-text p4-q3">懺悔如影隨形，<br>思念遍地狼藉。</div>
            <div class="p4-tag-wrapper tag-left" id="tag2">
                <a href="https://www.kdocs.cn/l/cqBPdQYPcjF5" target="_blank" class="p4-tag">「 話術 」</a >
                <div class="mini-tear"></div>
            </div>
        </div>
        <div class="p4-item" id="box4">
            <div class="p4-text p4-q4">原來，人對他者的痛苦<br>是毫無想象力的。</div>
            <div class="p4-tag-wrapper tag-center" id="tag3">
                <a href="https://www.kdocs.cn/l/cdTh6sMXtBej" target="_blank" class="p4-tag">「 頭牌卡 」</a >
                <div class="mini-tear"></div>
            </div>
        </div>
    </div>
    <div class="tap-hint" id="tapHint4" style="display: none;">輕觸屏幕，查收信件</div>
</div>
<div id="page5" class="page-container">
    <div class="paper-grid" id="paperGrid"></div>
    <div class="p5-wrapper">
        <div class="p5-quote" id="p5Quote">淚水流過生命是否淡到無痕</div>
        <div class="p5-header" id="p5Header">她給你寄來了一封信：<div class="ink-tear"></div></div>
        <div class="p5-rules-box" id="rulesBox"></div>
    </div>
    <div class="tap-hint" id="tapHint5" style="display: none;">輕觸屏幕，結束</div>
</div>
<div id="page6" class="page-container">
    <div class="p6-text-1" id="p6Text1">取一單字淚，允赴天下愁</div>
    <div class="p6-text-2" id="p6Text2">祝好</div>
</div>
<script>
    const bgMusic = document.getElementById('bgMusic'), page1 = document.getElementById('page1'), page2 = document.getElementById('page2'), page3 = document.getElementById('page3'), page4 = document.getElementById('page4'), page5 = document.getElementById('page5'), page6 = document.getElementById('page6');
    const p2Title = document.getElementById('p2-title'), hangingTear = document.getElementById('hangingTear'), p2Info = document.getElementById('p2-info'), tapHint2 = document.getElementById('tapHint2'), tapHint3 = document.getElementById('tapHint3'), tapHint4 = document.getElementById('tapHint4'), tapHint5 = document.getElementById('tapHint5');
    const p3Quote = document.getElementById('p3-quote'), p3Cursor = document.getElementById('p3-cursor'), p3Tear = document.getElementById('p3-tear'), p3Tags = document.getElementById('p3-tags'), p3RandomDog = document.getElementById('p3-random-dog'), p3RandomProp = document.getElementById('p3-random-prop');
    const box1 = document.getElementById('box1'), rippleBox = document.getElementById('rippleBox'), box2 = document.getElementById('box2'), tag1 = document.getElementById('tag1'), box3 = document.getElementById('box3'), tag2 = document.getElementById('tag2'), box4 = document.getElementById('box4'), tag3 = document.getElementById('tag3');
    const paperGrid = document.getElementById('paperGrid'), p5Quote = document.getElementById('p5Quote'), p5Header = document.getElementById('p5Header'), rulesBox = document.getElementById('rulesBox'), p6Text1 = document.getElementById('p6Text1'), p6Text2 = document.getElementById('p6Text2');
    const canvas = document.getElementById('starfield');
    const textLines = ["我名為「霧凇」", "天蠍座", "T", "18歲", "INTP"];
    let currentStep = 0, p3Step = 0, isPage4Finished = false, isPage5Finished = false; bgMusic.volume = 0.6;
    function goToPage(nextPage) { document.querySelectorAll('.page-container').forEach(p => p.classList.remove('active-page')); setTimeout(() => { nextPage.classList.add('active-page'); }, 500); }
    page1.addEventListener('click', function startApp() {
        if (bgMusic.paused) bgMusic.play().catch(e => console.log(e));
        document.getElementById('musicTip').style.display = 'none'; goToPage(page2);
        setTimeout(() => { page2.classList.add('page2-active'); p2Title.classList.add('show'); setTimeout(() => { hangingTear.classList.add('show'); }, 1500); tapHint2.style.opacity = '1'; }, 1000);
    }, { once: true });
    page2.addEventListener('click', function showNextLine() {
        if (currentStep < textLines.length) {
            const div = document.createElement('div'); div.className = 'info-item'; if (currentStep === 0) div.classList.add('name');
            div.innerText = textLines[currentStep]; p2Info.appendChild(div); setTimeout(() => div.classList.add('show-item'), 50); currentStep++;
            if (currentStep === textLines.length) tapHint2.style.opacity = '0';
        } else { goToPage(page3); setTimeout(() => { p3Quote.classList.add('fade-in-up'); tapHint3.style.display = 'block'; tapHint3.style.opacity = '1'; }, 500); }
    });
    page3.addEventListener('click', function() {
        if (p3Step === 0) {
            tapHint3.style.opacity = '0'; p3Cursor.classList.add('animate-cursor'); p3Step = 1;
            setTimeout(() => {
                p3Cursor.classList.remove('animate-cursor'); p3Tear.classList.add('animate-tear-drop');
                setTimeout(() => {
                    p3Tags.classList.add('fade-in-up');
                    if (Math.random() > 0.3) { p3RandomDog.innerText = "「 隨機掉落：詭辯狗一 」"; p3RandomDog.classList.add('fade-in-up'); }
                    const randomProps = ["sub1", "sub0", "dom0"].sort(() => 0.5 - Math.random()).slice(0, 2);
                    setTimeout(() => { p3RandomProp.innerText = `「 隨機掉落：${randomProps.join(" / ")} 」`; p3RandomProp.classList.add('fade-in-up'); }, 800);
                    setTimeout(() => { tapHint3.innerText = "輕觸屏幕，繼續"; tapHint3.style.opacity = '1'; p3Step = 2; }, 2000);
                }, 1500);
            }, 2000);
        } else if (p3Step === 2) { tapHint3.style.opacity = '0'; goToPage(page4); setTimeout(startPage4Animation, 800); p3Step = 3; }
    });
    function startPage4Animation() {
        setTimeout(() => { box1.classList.add('focus-in'); }, 500);
        setTimeout(() => { rippleBox.style.opacity = '1'; rippleBox.classList.add('animate-ripple'); }, 1500);
        setTimeout(() => { box2.classList.add('focus-in'); }, 3500); setTimeout(() => { tag1.classList.add('show'); }, 4300);
        setTimeout(() => { box3.classList.add('focus-in'); }, 6000); setTimeout(() => { tag2.classList.add('show'); }, 6800);
        setTimeout(() => { box4.classList.add('focus-in'); }, 8500); setTimeout(() => { tag3.classList.add('show'); }, 9300);
        setTimeout(() => { isPage4Finished = true; tapHint4.style.display = 'block'; tapHint4.style.opacity = '1'; }, 10500);
    }
    page4.addEventListener('click', function() { if (isPage4Finished) { tapHint4.style.opacity = '0'; goToPage(page5); setTimeout(startPage5Animation, 800); isPage4Finished = false; } });
    const rulesData = ["Le 婉拒男板 點了自動送單", "搗亂默認送單", "開始前請填表", "話術要截屏預留請提前告知", "默認戀感中等", "打字中速", "拿打字速度作為退單要求那我恕不接受", "動描愛好者 回合制愛好者", "不喜歡表格備註", "暗雷默認送單", "1h10mine後不退 30mine5mine後不退", "單外是個時而呆愣的人機", "所以有時候單前溝通請在表格說明"];
    async function startPage5Animation() {
        setTimeout(() => paperGrid.classList.add('show'), 500); setTimeout(() => p5Quote.classList.add('show'), 1000); setTimeout(() => p5Header.classList.add('show'), 2500);
        setTimeout(async () => {
            for (let i = 0; i < rulesData.length; i++) {
                const line = document.createElement('div'); line.className = 'type-line';
                line.innerHTML = rulesData[i].replace(/(不退|恕不接受|默認送單|自動送單)/g, '<span class="highlight">$1</span>') + '<span class="type-cursor"></span>';
                rulesBox.appendChild(line); await new Promise(r => setTimeout(r, 100 + Math.random() * 200)); line.classList.add('show');
                await new Promise(r => setTimeout(r, 200)); const c = line.querySelector('.type-cursor'); if(c) c.remove();
                if(i % 3 === 0) { const p = document.createElement('span'); p.className = 'type-cursor'; line.appendChild(p); await new Promise(r => setTimeout(r, 400)); p.remove(); }
            }
            tapHint5.style.display = 'block'; tapHint5.style.opacity = '1'; isPage5Finished = true;
        }, 4000);
    }
    page5.addEventListener('click', function() {
        if (isPage5Finished) {
            tapHint5.style.opacity = '0'; goToPage(page6);
            setTimeout(() => { p6Text1.classList.add('show'); setTimeout(() => { p6Text2.classList.add('show'); }, 2000); }, 800);
            isPage5Finished = false;
        }
    });
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    function initCanvas() {
        w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
